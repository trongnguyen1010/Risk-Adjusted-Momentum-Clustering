model = "gpt-5.6-terra"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"
interrupt_message = true

[agents.explorer]
description = "Read-only codebase explorer. Use only when relevant code paths are not already known."
config_file = "./agents/explorer.toml"

[agents.implementer]
description = "Primary scoped implementation agent for DELTA stage work."
config_file = "./agents/implementer.toml"

[agents.verifier]
description = "Read-only verifier for correctness, tests, artifacts, scope, and research invariants."
config_file = "./agents/verifier.toml"

[agents.auditor]
description = "High-rigor methodology and architecture auditor. Escalation only."
config_file = "./agents/auditor.toml"
