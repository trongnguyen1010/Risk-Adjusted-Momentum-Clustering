[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-t1"
version = "0.2.0"
description = "Product and research foundation for Vietnam company intelligence"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vnstock = ["vnstock==4.0.6"]
research = [
    "matplotlib==3.11.1",
    "pandas",
]

[project.scripts]
delta = "delta_t1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
delta_t1 = ["schemas/*.json"]
